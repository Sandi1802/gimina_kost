<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard Internal Kos</title>
    <link rel="icon" href="{{ url_for('static', filename='uploads/logo.png') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                50: '#fbf8f1',
                100: '#f5efdf',
                200: '#eaddbf',
                300: '#dec497',
                400: '#d1a66a',
                500: '#c58d46',
                600: '#b08d35',
                700: '#94662b',
                800: '#7a5429',
                900: '#634524',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style> 
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body class="flex flex-col justify-center min-h-screen py-12 sm:px-6 lg:px-8 relative overflow-hidden">
    
    <!-- Decorative Background -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-gold-100 opacity-50 blur-3xl"></div>
        <div class="absolute top-[60%] -right-[10%] w-[40%] h-[60%] rounded-full bg-green-50 opacity-60 blur-3xl"></div>
    </div>

    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center z-10">
        <img src="{{ url_for('static', filename='uploads/logo.png') }}" alt="Gimina Kost Logo" class="h-20 mx-auto drop-shadow-md mb-2" onerror="this.src='https://via.placeholder.com/150?text=Gimina+Kost'">
        <h2 class="mt-2 text-3xl font-extrabold text-gray-900 tracking-tight">
            Internal Dashboard
        </h2>
        <p class="mt-2 text-sm text-gray-500 font-medium">
            Sistem Manajemen Pusat <span class="text-gold-600">Gimina Kost</span>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md z-10">
        <div class="glass-card py-8 px-4 sm:rounded-2xl sm:px-10">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="p-4 mb-6 rounded-lg text-sm flex items-start {% if category == 'success' %}bg-green-50 text-green-700 border border-green-200{% elif category == 'danger' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
                    <i class="fas {% if category == 'success' %}fa-check-circle{% elif category == 'danger' %}fa-exclamation-circle{% else %}fa-info-circle{% endif %} mt-0.5 mr-3 text-lg"></i>
                    <span>{{ message }}</span>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form class="space-y-6" action="{{ url_for('admin_login') }}" method="POST">
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700">
                        Alamat Email
                    </label>
                    <div class="mt-2 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-gray-400"></i>
                        </div>
                        <input id="email" name="email" type="email" autocomplete="email" required placeholder="owner@kos.com"
                               class="appearance-none block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gold-500 focus:border-gold-500 sm:text-sm transition-all duration-200 bg-gray-50 focus:bg-white">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700">
                        Kata Sandi
                    </label>
                    <div class="mt-2 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"
                               class="appearance-none block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gold-500 focus:border-gold-500 sm:text-sm transition-all duration-200 bg-gray-50 focus:bg-white">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                            class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-md text-sm font-bold text-white bg-gold-600 hover:bg-gold-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gold-500 transition-all duration-200 transform hover:-translate-y-0.5">
                        Masuk ke Dashboard <i class="fas fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </form>
        </div>
        
        <div class="mt-6 text-center text-xs text-gray-400">
            &copy; 2026 Gimina Kost. All rights reserved.
        </div>
    </div>
</body>
</html>

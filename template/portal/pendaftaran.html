{% extends 'layout.html' %}
{% block title %}Pendaftaran Penghuni - Kos{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-200">
    <div class="mb-8 border-b border-gray-100 pb-6">
        <h2 class="text-3xl font-bold text-gray-900">Pendaftaran Penghuni Baru</h2>
        <p class="text-gray-500 mt-2">Silakan lengkapi data diri Anda di bawah ini untuk mengajukan pendaftaran sewa kos.</p>
    </div>

    <form class="mt-8 space-y-6" method="POST">
        <div class="rounded-md shadow-sm -space-y-px">
            <div>
                <label for="full_name" class="sr-only">Nama Lengkap</label>
                <input id="full_name" name="full_name" type="text" required class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-gold-500 focus:border-gold-500 focus:z-10 sm:text-sm" placeholder="Nama Lengkap Sesuai KTP">
            </div>
            <div>
                <label for="email" class="sr-only">Email</label>
                <input id="email" name="email" type="email" required class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-gold-500 focus:border-gold-500 focus:z-10 sm:text-sm" placeholder="Alamat Email Aktif">
            </div>
            <div>
                <label for="phone" class="sr-only">No. WhatsApp</label>
                <input id="phone" name="phone" type="text" required class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-gold-500 focus:border-gold-500 focus:z-10 sm:text-sm" placeholder="No. WhatsApp (08xxxx)">
            </div>
            <div>
                <label for="password" class="sr-only">Password</label>
                <input id="password" name="password" type="password" required class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-gold-500 focus:border-gold-500 focus:z-10 sm:text-sm" placeholder="Buat Password">
            </div>
        </div>

        <div>
            <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-md text-white bg-gold-600 hover:bg-gold-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gold-500 shadow-md transition-colors">
                <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                    <svg class="h-5 w-5 text-gold-300 group-hover:text-gold-200" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                    </svg>
                </span>
                Buat Akun Sekarang
            </button>
        </div>
        
        <div class="text-center mt-4 border-t border-gray-200 pt-4">
            <p class="text-sm text-gray-600">
                Sudah punya akun? <a href="{{ url_for('login_penghuni', next=request.args.get('next')) }}" class="font-bold text-gold-600 hover:text-gold-700">Masuk di sini</a>
            </p>
        </div>
    </form>
</div>
{% endblock %}

{% extends 'layout.html' %}
{% block title %}Laporkan Keluhan - Kos{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-sm border border-gray-200">
    <div class="mb-8">
        <h2 class="text-2xl font-bold text-gray-900">Formulir Keluhan / Kerusakan</h2>
        <p class="text-gray-500 mt-1">Kami akan segera menindaklanjuti laporan Anda.</p>
    </div>

    <form method="POST" action="{{ url_for('public_keluhan') }}" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700">Kategori</label>
            <select name="category" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                <option value="Listrik">Listrik</option>
                <option value="Air/Pipa">Air / Saluran Pipa</option>
                <option value="AC">AC (Air Conditioner)</option>
                <option value="Furniture">Furniture (Kasur, Lemari, dll)</option>
                <option value="Keamanan">Keamanan</option>
                <option value="Lainnya">Lainnya</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Judul Keluhan</label>
            <input type="text" name="title" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="Contoh: AC Bocor">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Deskripsi Detail</label>
            <textarea name="description" rows="4" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500" placeholder="Jelaskan secara detail kerusakan yang terjadi..."></textarea>
        </div>
        <div class="pt-4">
            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Kirim Keluhan
            </button>
        </div>
    </form>
</div>
{% endblock %}
